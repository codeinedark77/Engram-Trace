[project]
name = "chronicle"
version = "0.4.0"
description = "Tamper-evident decision-trace recorder for autonomous agent systems"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "pytest-cov>=4.1"]

[project.scripts]
chronicle = "chronicle.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chronicle*"]
